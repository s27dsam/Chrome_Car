<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chrome Cars Options</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Chrome Cars Options</h1>
    </header>
    <div class="card">
      <h2>Settings</h2>
      <div class="setting">
        <label for="speedRange">Speed</label>
        <input type="range" id="speedRange" min="1" max="10" value="5">
      </div>
      <div class="setting">
        <label for="tireSelection">Tires</label>
        <select id="tireSelection">
          <option value="All-Season">All-Season</option>
          <option value="Touring">Touring</option>
          <option value="Grip-Lite">Grip-Lite</option>
        </select>
      </div>
    </div>
    <div class="card">
        <h2>Cones</h2>
        <div class="setting">
            <button id="addCone">Add Cone</button>
            <span id="coneCounter">0/5</span>
        </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>

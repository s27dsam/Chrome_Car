<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="mainView">
    <div class="container">
      <header>
      </header>
      <div class="card">
        <h2>Pick Car</h2>
        <form id="carSelectionForm">
          <label>
            <input type="radio" name="car" value="Car1.png" checked>
            <img src="images/Car1.png" alt="Car 1" class="car-option">
          </label>
          <label>
            <input type="radio" name="car" value="Car2.png">
            <img src="images/Car2.png" alt="Car 2" class="car-option">
          </label>
          <label>
            <input type="radio" name="car" value="Car3.png">
            <img src="images/Car3.png" alt="Car 3" class="car-option">
          </label>
        </form>
      </div>
      <div class="actions">
        <button id="optionsButton">Options</button>
        <button id="donateButton">Donate</button>
      </div>
      <div class="actions">
        <button id="LoadCar">Load Car</button>
        <button id="UnloadCar">Unload Car</button>
      </div>
      <div id="result"></div>
    </div>
  </div>
  <div id="optionsView" style="display: none;">
    <div class="container">
      <header>
      </header>
      <div class="card">
        <h2>Settings</h2>
        <div class="setting">
          <label for="speedRange">Speed</label>
          <input type="range" id="speedRange" min="1" max="10" value="5">
        </div>
        <div class="setting">
          <label for="tireSelection">Tires</label>
          <select id="tireSelection">
            <option value="normal">All-Season</option>
            <option value="sport">Sport</option>
            <option value="drift">Drift</option>
          </select>
        </div>
        <div class="setting">
          <label for="trailColor">Trail Color</label>
          <select id="trailColor">
            <option value="#4deeea">Cyan</option>
            <option value="#74ee15">Green</option>
            <option value="#ffe700">Yellow</option>
            <option value="#f000ff">Magenta</option>
            <option value="#001eff">Blue</option>
          </select>
        </div>
        <div class="setting">
          <label for="trailLength">Trail Length</label>
          <input type="number" id="trailLength" min="1" max="1000" value="20">
        </div>
      </div>
      <div class="actions">
        <button id="backButton">Back</button>
      </div>
    </div>
  </div>
  <div id="donateView" style="display: none;">
    <div class="container">
      <header>
        <h1>Donate</h1>
      </header>
      <div class="card">
        <h2>Support the developer!</h2>
        <p>If you enjoy this extension, please consider donating to support its development.</p>
        <div class="wallet-container">
          <input type="text" id="walletAddress" value="bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh" readonly>
          <button id="copyButton">COPY BTC</button>
        </div>
      </div>
      <div class="actions">
        <button id="backButtonDonate">Back</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

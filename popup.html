<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chrome Cars 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Chrome Cars 2</h1>
    </header>
    <div class="card">
      <h2>Select Car</h2>
      <form id="carSelectionForm">
        <label>
          <input type="radio" name="car" value="Car1.png" checked>
          <img src="images/Car1.png" alt="Car 1" class="car-option">
        </label>
        <label>
          <input type="radio" name="car" value="Car2.png">
          <img src="images/Car2.png" alt="Car 2" class="car-option">
        </label>
        <label>
          <input type="radio" name="car" value="Car3.png">
          <img src="images/Car3.png" alt="Car 3" class="car-option">
        </label>
      </form>
    </div>
    <div class="card">
      <h2>Settings</h2>
      <div class="setting">
        <label for="speedRange">Speed</label>
        <input type="range" id="speedRange" min="1" max="10" value="5">
      </div>
      <div class="setting">
        <label for="tireSelection">Tires</label>
        <select id="tireSelection">
          <option value="All-Season">All-Season</option>
          <option value="Touring">Touring</option>
          <option value="Grip-Lite">Grip-Lite</option>
        </select>
      </div>
    </div>
    <div class="card">
        <h2>Cones</h2>
        <div class="setting">
            <button id="addCone">Add Cone</button>
            <span id="coneCounter">0/5</span>
        </div>
    </div>
    <div class="actions">
      <button id="LoadCar">Load Car</button>
      <button id="UnloadCar">Unload Car</button>
    </div>
    <div id="result"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
